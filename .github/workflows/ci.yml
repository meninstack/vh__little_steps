name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Gradle has to run on JDK 21: the lint bundled with the Android Gradle
      # Plugin calls List.removeLast(), which JDK 17 does not have. The app
      # itself still compiles to Java 17 bytecode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      # With the upload key in the repository secrets, release builds are
      # signed for Google Play. Without it (a fork, or before the key exists)
      # they are signed with the debug key and only install for testing. See
      # docs/RELEASE.md.
      - name: Install the upload key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: little-steps-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Proves the web target still compiles. The store screenshots are taken
      # from this build.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: little-steps-web
          path: build/web
          if-no-files-found: error

      # Google Play takes an App Bundle, and only one signed with the upload key.
      - name: Build Android App Bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: little-steps-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # pubspec.lock is committed. This fails, and prints what to change, when
      # it no longer matches pubspec.yaml.
      - name: Check the lockfile is current
        if: always()
        run: git diff --exit-code pubspec.lock

  # Compiles the iOS app without signing it, to prove the project builds. A
  # store build also needs an Apple Developer team; see docs/RELEASE.md.
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
